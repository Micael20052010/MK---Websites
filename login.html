<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro - MK - LN's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">MK - LN's</h1>
            <p class="subtitle">Leia e crie suas próprias Light Novels gratuitamente!</p>
        </div>
    </header>

    <main class="container">

        <div style="margin-bottom: 20px;">
            <a href="index.html" class="contact-btn" style="display: inline-block;">← Voltar para o Início</a>
            <a href="painel-autor.html" class="contact-btn" style="background: #27ae60;">Área do Autor / Criar LN</a>
        </div>

        <section class="intro-card">
            <h2>Criar uma Conta</h2>
            <p>Cadastre-se para poder salvar suas leituras e publicar suas próprias Light Novels!</p>
            <br>
            
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="nome" style="font-weight: 700; display: block; margin-bottom: 5px;">Nome de Usuário / Autor:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome ou apelido" required style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ffe0b2; font-size: 1rem;">
                </div>

                <div>
                    <label for="email-cad" style="font-weight: 700; display: block; margin-bottom: 5px;">E-mail:</label>
                    <input type="email" id="email-cad" name="email" placeholder="seu@email.com" required style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ffe0b2; font-size: 1rem;">
                </div>

                <div>
                    <label for="senha-cad" style="font-weight: 700; display: block; margin-bottom: 5px;">Senha:</label>
                    <input type="password" id="senha-cad" name="senha" placeholder="Crie uma senha segura" required style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ffe0b2; font-size: 1rem;">
                </div>

                <button type="submit" class="contact-btn" style="cursor: pointer; font-size: 1rem; border: none; align-self: flex-start;">Cadastrar Conta</button>
            </form>
        </section>

        <section class="intro-card">
            <h2>Já tem uma conta? (Entrar)</h2>
            <br>
            
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="email-login" style="font-weight: 700; display: block; margin-bottom: 5px;">E-mail:</label>
                    <input type="email" id="email-login" name="email" placeholder="seu@email.com" required style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ffe0b2; font-size: 1rem;">
                </div>

                <div>
                    <label for="senha-login" style="font-weight: 700; display: block; margin-bottom: 5px;">Senha:</label>
                    <input type="password" id="senha-login" name="senha" placeholder="Sua senha" required style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ffe0b2; font-size: 1rem;">
                </div>

                <button type="submit" class="contact-btn" style="cursor: pointer; font-size: 1rem; border: none; align-self: flex-start;">Entrar no Site</button>
            </form>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <div class="copyright-section">
                <p>&copy; 2026 <strong>MK - LN's</strong>. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

</body>
</html>
